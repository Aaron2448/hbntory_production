version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hbntory_postgres
    environment:
      POSTGRES_USER: hbntory_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: hbntory_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    container_name: hbntory_web
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://hbntory_user:secure_password_123@db:5432/hbntory_prod
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
