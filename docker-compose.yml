services:
  db:
    image: postgres:15-alpine
    container_name: hbntory_postgres
    environment:
      POSTGRES_USER: hbntory_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: hbntory_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbntory_user -d hbntory_prod"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  web:
    build: .
    container_name: hbntory_web
    command: >
      sh -c "python -m alembic upgrade head &&
             python seed_and_query.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://hbntory_user:secure_password_123@db:5432/hbntory_prod
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
